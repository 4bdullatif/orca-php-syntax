name: Release

on:
  workflow_run:
    workflows: [Check plugin]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Read the manifest version
        id: version
        run: echo "tag=v$(jq -r .version orca-plugin.json)" >> "$GITHUB_OUTPUT"
      - name: Publish the release when its tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG is already released"
          else
            gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes
          fi
